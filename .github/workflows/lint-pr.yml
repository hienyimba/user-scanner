name: PHP Syntax Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Check PHP syntax
        run: >-
          git ls-files -z -- '*.php'
          ':!OLD/**' ':!laravel_app/**' ':!user-*/**' ':!vendor/**'
          | xargs -0 -r -n 1 php -l
