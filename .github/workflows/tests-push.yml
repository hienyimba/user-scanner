name: Tests (PHPUnit + coverage)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (PHPUnit + coverage) — PHP 8.4
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      # Synthetic test key only; no deployment credentials are needed.
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, pcntl, sqlite3, pdo_sqlite
          ini-values: ffi.enable=true
          coverage: pcov

      - name: Install Composer dependencies
        run: |
          rm -rf -- vendor
          composer install --no-interaction --prefer-dist

      - name: Run PHPUnit with coverage
        run: |
          mkdir -p test-output
          php vendor/bin/phpunit --no-progress \
            --log-junit test-output/report.xml \
            --coverage-clover test-output/coverage.xml \
            --coverage-text

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-php84
          path: test-output
