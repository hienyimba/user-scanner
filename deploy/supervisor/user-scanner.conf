; Initial 8 GB / 4 dedicated vCPU profile: 20 workers total.
; Replace the old [program:user-scanner] definition; do not run both profiles.
; See deploy/scanner-queues.md for the migration and drain/cutover procedure.

[program:user-scanner-email]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/user-scanner
command=php8.4 /var/www/user-scanner/artisan queue:work database --queue=scanner-email --sleep=1 --tries=1 --timeout=90 --memory=256 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=5
redirect_stderr=true
stdout_logfile=/var/www/user-scanner/storage/logs/supervisord-email-%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=180
stopasgroup=true
killasgroup=true

[program:user-scanner-username]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/user-scanner
; scanner is a compatibility fallback for legacy queued jobs, not a new route.
command=php8.4 /var/www/user-scanner/artisan queue:work database --queue=scanner-username,scanner --sleep=1 --tries=1 --timeout=90 --memory=256 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=5
redirect_stderr=true
stdout_logfile=/var/www/user-scanner/storage/logs/supervisord-username-%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=180
stopasgroup=true
killasgroup=true

[program:user-scanner-shared]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/user-scanner
; Borrowable capacity, preferring email; neither mode loses its five reserved workers.
command=php8.4 /var/www/user-scanner/artisan queue:work database --queue=scanner-email,scanner-username,scanner --sleep=1 --tries=1 --timeout=90 --memory=256 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=10
redirect_stderr=true
stdout_logfile=/var/www/user-scanner/storage/logs/supervisord-shared-%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=180
stopasgroup=true
killasgroup=true
